<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Scheduler</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <h1>Team Scheduler</h1>
  <button class="btn primary" id="btn-parse">Parse &amp; Run</button>
  <button class="btn" id="btn-pause" disabled>Pause</button>
  <button class="btn" id="btn-reset" disabled>Reset</button>
  <button class="btn warn" id="btn-unpin" style="display:none">Unpin All</button>
  <span id="stat"></span>
</header>

<main>
  <div id="editor-panel">
    <div class="panel-label">Input</div>
    <textarea id="input" spellcheck="false"></textarea>
  </div>
  <div id="viz-panel">
    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="hint" style="display:none">
        <div>Click <strong>Parse &amp; Run</strong> to start</div>
        <span>drag to pin · tap pin to release · pause to inspect</span>
      </div>
    </div>
    <div id="output-panel">
      <div class="panel-label">
        Assignments
        <button class="btn" id="btn-copy" style="padding:2px 8px;font-size:10px">Copy</button>
      </div>
      <textarea id="output" readonly spellcheck="false"></textarea>
    </div>
  </div>
</main>

<script src="js/parser.js"></script>
<script src="js/physics.js"></script>
<script src="js/renderer.js"></script>
<script src="js/assignments.js"></script>
<script src="js/app.js"></script>
</body>
</html>
